name: Signed Mac beta
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-14
    environment: production
    env:
      QUIP_SUPABASE_URL: ${{ vars.QUIP_SUPABASE_URL }}
      QUIP_SUPABASE_ANON_KEY: ${{ vars.QUIP_SUPABASE_ANON_KEY }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/release-preflight.mjs
      - run: npm ci
      - run: npm run typecheck && npm run check:cloud && npm test
      - run: npm run build && npm run build:electron
      - run: npm run test:e2e
      - run: npx --no-install electron-builder --mac --arm64 --publish always
      - uses: actions/upload-artifact@v4
        with:
          name: quip-mac-beta
          path: |
            release/*.dmg
            release/*.zip
            release/*mac*.yml
